services:
  screener:
    build: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      TESTER_APP_URL: /tester
      FRED_API_KEY: ${FRED_API_KEY:-}
      TRADINGVIEW_MCP_ENABLED: ${TRADINGVIEW_MCP_ENABLED:-1}
      TRADINGVIEW_MCP_REDIRECT_URI: ${TRADINGVIEW_MCP_REDIRECT_URI:-}
      TRADINGVIEW_MCP_STORAGE_DIR: /app/persistent/tradingview_mcp
    expose:
      - "8501"
    volumes:
      - ./persistent/custom_universe_lists.json:/app/custom_universe_lists.json
      - ./persistent/finance_cache:/app/persistent/finance_cache
      - ./persistent/bybit_derivatives:/app/persistent/bybit_derivatives
      - ./persistent/global_liquidity:/app/persistent/global_liquidity
      - ./persistent/tradingview_mcp:/app/persistent/tradingview_mcp

  tester:
    build: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - tester_app.py
      - --server.baseUrlPath=tester
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    expose:
      - "8501"
    volumes:
      - ./persistent/saved_strategies.json:/app/data/saved_strategies.json

  interviews:
    build: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - interviews_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    env_file:
      - .env
    environment:
      INTERVIEWS_DB_PATH: /app/persistent/interviews/interviews.db
    expose:
      - "8501"
    volumes:
      - ./persistent/interviews:/app/persistent/interviews

  interviews-worker:
    build: .
    restart: unless-stopped
    command:
      - uvicorn
      - interviews_worker:app
      - --host=0.0.0.0
      - --port=9100
    env_file:
      - .env
    environment:
      INTERVIEWS_DB_PATH: /app/persistent/interviews/interviews.db
      INTERVIEWS_TIMEZONE: Europe/Moscow
      INTERVIEWS_WEEKDAY: "4"
      INTERVIEWS_HOUR: "8"
      INTERVIEWS_INITIAL_LIMIT: "10"
      OPENAI_MODEL: gpt-5.5-2026-04-23
    expose:
      - "9100"
    volumes:
      - ./persistent/interviews:/app/persistent/interviews
    networks:
      - default
      - finance_internal

  finance-api:
    build: .
    restart: unless-stopped
    command:
      - uvicorn
      - finance_api:app
      - --host=0.0.0.0
      - --port=9000
    env_file:
      - .env
    environment:
      FINANCE_CACHE_DIR: /app/persistent/finance_cache
      FINANCE_UNIVERSE_PATH: /app/custom_universe_lists.json
    expose:
      - "9000"
    volumes:
      - ./persistent/custom_universe_lists.json:/app/custom_universe_lists.json:ro
      - ./persistent/finance_cache:/app/persistent/finance_cache
    networks:
      - default
      - finance_internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - screener
      - tester
      - interviews
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - caddy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}

networks:
  finance_internal:
    external: true
